<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de inmuebles · Llopart Euroconsejo</title>
    <meta name="description" content="Vista isométrica animada de la cartera de inmuebles gestionados." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bea'/%3E%3Cpath d='M16 7l10 9h-3v9h-5v-6h-4v6H9v-9H6z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z" fill="currentColor" /></svg>
          </span>
          <span class="brand-name">Llopart <b>Euroconsejo</b></span>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
          <input id="search" type="search" placeholder="Buscar inmueble, dirección, inquilino…" autocomplete="off" />
        </label>
        <div class="topbar-right">
          <span class="live"><i></i> En vivo <b id="clock">--:--</b></span>
          <button id="nightToggle" class="icon-btn" title="Modo día / noche" aria-label="Modo día / noche">
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" /></svg>
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          </button>
          <div class="user">
            <span class="avatar">LE</span>
            <span class="user-meta"><b>Gestión</b><small>Administración de fincas</small></span>
          </div>
        </div>
      </header>

      <section class="kpis" id="kpis" aria-label="Indicadores"></section>

      <div class="map-tools" aria-label="Controles del mapa">
        <button class="icon-btn" data-zoom="in" title="Acercar" aria-label="Acercar">+</button>
        <button class="icon-btn" data-zoom="out" title="Alejar" aria-label="Alejar">−</button>
        <button class="icon-btn" id="resetView" title="Vista general" aria-label="Vista general">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" /></svg>
        </button>
      </div>

      <div class="legend" id="legend"></div>

      <section class="portfolio card" aria-label="Cartera">
        <div class="card-head">
          <h2>Cartera</h2>
          <div class="chips" id="filters"></div>
        </div>
        <div class="plist" id="plist"></div>
      </section>

      <section class="activity card" aria-label="Actividad reciente">
        <div class="card-head"><h2>Actividad reciente</h2></div>
        <ul id="activity"></ul>
      </section>

      <aside class="panel" id="panel" aria-live="polite" aria-hidden="true"></aside>
      <div class="tooltip" id="tooltip" role="tooltip"></div>
      <p class="hint" id="hint">Haz clic en un inmueble para ver su ficha · arrastra para girar · rueda para hacer zoom</p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
